<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Velvet | متجر الكتب</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo">Velvet <span>مكتبة</span></div>
        <div class="tools">
            <button id="themeBtn">🌙</button>
            <button id="cartBtn">🛒 <sup id="cartN">0</sup></button>
            <button id="authBtn" class="btn-admin">دخول / حساب جديد</button>
            <a href="admin.html" id="adminLink" class="btn-pri" style="display:none; text-decoration:none;">لوحة المالك 👑</a>
        </div>
    </header>

    <main>
        <div class="hero">
            <h1>Velvet</h1>
            <p>كتب تستحق القراءة، بتوصلك لحد باب البيت</p>
        </div>
        <section id="books">
            <h2>📚 جميع الكتب</h2>
            <div class="grid" id="grid"></div>
        </section>
    </main>

    <dialog id="bookModal">
        <form method="dialog"><button class="x">✖</button></form>
        <div id="bookDetails"></div>
    </dialog>

    <dialog id="authModal">
        <form method="dialog"><button class="x">✖</button></form>
        <div id="authContent"></div>
    </dialog>

    <script src="app.js"></script>
</body>
</html>
