<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Velvet | متجر الكتب</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo">Velvet <span>مكتبة</span></div>
        <div class="tools">
            <button id="themeBtn">🌙</button>
            <button id="cartBtn">🛒 <sup id="cartN">0</sup></button>
            <a href="admin.html" class="btn-admin">دخول المالك</a>
        </div>
    </header>

    <main>
        <div class="hero">
            <h1>Velvet</h1>
            <p>كتب تستحق القراءة، بتوصلك لحد باب البيت</p>
        </div>

        <section id="books">
            <h2>📚 جميع الكتب</h2>
            <div class="grid" id="grid">
                <p style="text-align:center; width:100%;">جاري تحميل الكتب...</p>
            </div>
        </section>
    </main>

    <script>
        const sb = supabase.createClient(window.ENV.VITE_SUPABASE_URL, window.ENV.VITE_SUPABASE_ANON_KEY);
        const $ = s => document.querySelector(s);
        let cart = JSON.parse(localStorage.getItem('cart') || '{}');

        // الوضع الليلي
        $('#themeBtn').onclick = () => {
            document.body.classList.toggle('dark-mode');
            $('#themeBtn').textContent = document.body.classList.contains('dark-mode') ? '☀️' : '🌙';
        };

        // جلب الكتب
        async function loadBooks() {
            const { data, error } = await sb.from('books').select('*').order('created_at', { ascending: false });
            if (error) return $('#grid').innerHTML = '<p>حدث خطأ في تحميل الكتب.</p>';
            
            if (data.length === 0) {
                return $('#grid').innerHTML = '<p>لا توجد كتب حالياً.</p>';
            }

            $('#grid').innerHTML = data.map(b => `
                <div class="card">
                    <div class="cover">${b.title}</div>
                    <h4>${b.title}</h4>
                    <b>${b.discount_price || b.price} ج</b>
                    <button onclick="addToCart('${b.id}')" class="btn-pri">أضف للسلة</button>
                </div>
            `).join('');
        }

        // السلة
        window.addToCart = (id) => {
            cart[id] = (cart[id] || 0) + 1;
            localStorage.setItem('cart', JSON.stringify(cart));
            $('#cartN').innerText = Object.values(cart).reduce((a, b) => a + b, 0);
            alert('تمت الإضافة للسلة!');
        };

        $('#cartN').innerText = Object.values(cart).reduce((a, b) => a + b, 0);
        loadBooks();
    </script>
</body>
</html>
