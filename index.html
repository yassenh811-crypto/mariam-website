<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Velvet | متجر الكتب</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0"></script>
</head>
<body class="light-mode">

    <!-- شاشة الترحيب والأنميشن -->
    <div id="loader">
        <div class="fl l">✿</div>
        <div id="welcome">أهلاً بكِ في Velvet 🌸</div>
        <div class="fl r">✿</div>
    </div>

    <!-- شريط التنقل -->
    <header>
        <div class="logo">Velvet <span>مكتبة</span></div>
        <div class="tools">
            <button id="themeBtn">🌙</button>
            <button id="wishBtn">★ <sup id="wishN">0</sup></button>
            <button id="cartBtn">🛒 <sup id="cartN">0</sup></button>
            <button id="authBtn" class="btn-pri">دخول</button>
        </div>
    </header>

    <!-- لوحة المالك (تظهر عند تسجيل الدخول) -->
    <div id="dash" hidden>
        <aside>
            <h3>لوحة المالك 👑</h3>
            <button data-act="tab" data-id="over" class="on">📊 نظرة عامة</button>
            <button data-act="tab" data-id="books">📚 الكتب</button>
            <button data-act="tab" data-id="orders">🧾 الأوردرات <span id="notifBadge" class="notif" hidden></span></button>
            <button data-act="closedash">⬅ العودة للموقع</button>
        </aside>
        <div id="dc"></div>
    </div>

    <!-- المحتوى الرئيسي -->
    <main>
        <div class="hero">
            <h1>Velvet</h1>
            <p>كتب تستحق القراءة، بتوصلك لحد باب البيت</p>
            <a href="#books" class="btn">تصفّحي الكتب</a>
        </div>

        <section id="new">
            <h2>✨ جديدنا هذا الأسبوع</h2>
            <div class="grid" id="newGrid"></div>
        </section>

        <section id="books">
            <h2>📚 جميع الكتب</h2>
            <div class="chips" id="chips"></div>
            <div class="grid" id="grid"></div>
        </section>

        <section id="reviews">
            <h2>💬 آراء العملاء</h2>
            <div id="siteRev"></div>
        </section>
    </main>

    <!-- نافذة منبثقة (Modal) -->
    <dialog id="dlg">
        <form method="dialog"><button class="x">✖</button></form>
        <div id="dlgBody"></div>
    </dialog>

    <script src="app.js" type="module"></script>
</body>
</html>
